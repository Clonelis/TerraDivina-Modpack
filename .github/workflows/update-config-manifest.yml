name: Update config manifest

on:
  push:
    branches: [main]
    paths:
      - config/**
      - resourcepacks/**
      - options.txt
      - servers.dat
      - .github/scripts/update-config-manifest.mjs
      - .github/workflows/update-config-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/update-config-manifest.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git commit -m "Update config manifest"
          git push
