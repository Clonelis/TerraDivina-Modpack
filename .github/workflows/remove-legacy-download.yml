name: Remove legacy website release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-legacy-download.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old site ZIP release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view modpack-download --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete modpack-download --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
