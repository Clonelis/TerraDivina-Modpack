name: Publish manual modpack download

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "config/**"
      - "resourcepacks/**"
      - ".github/workflows/publish-manual-download.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terradivina-manual-download
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modpack
        uses: actions/checkout@v4

      - name: Build archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          archive_name = "TerraDivina-Modpack.zip"
          directories = ("mods", "config", "resourcepacks")

          with ZipFile(archive_name, "w", compression=ZIP_DEFLATED, compresslevel=6) as archive:
              for directory in directories:
                  folder = Path(directory)
                  if not folder.is_dir():
                      raise SystemExit(f"Required directory is missing: {directory}")
                  for item in sorted(folder.rglob("*")):
                      if item.is_file() and item.name not in {".gitkeep", ".DS_Store"}:
                          archive.write(item, arcname=item.as_posix())

          print(f"Created {archive_name}: {Path(archive_name).stat().st_size} bytes")
          PY

      - name: Publish one up-to-date ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="modpack-download"
          ARCHIVE="TerraDivina-Modpack.zip"
          TITLE="TerraDivina | Create — актуальная сборка"
          NOTES="Автоматически обновляемый ZIP для ручной установки. Содержит mods, config и resourcepacks. Minecraft 1.21.1 / NeoForge 21.1.250."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
